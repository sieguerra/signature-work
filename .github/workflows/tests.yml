name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The suite uses a fake embedder and scripted judges, so it must stay
      # runnable with no provider credentials. A key leaking in would let a
      # test call a real model and make CI nondeterministic.
      - name: Run tests
        env:
          OPENAI_API_KEY: ""
        run: pytest -q

  # The console's pure logic (flight recorder, reliability filters, theme,
  # agent config) has node:test suites next to the files in web/. No npm
  # install: they use only the Node standard library.
  web:
    name: web (node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check scripts parse
        run: for f in web/*.js; do node --check "$f"; done

      - name: Run tests
        run: node --test web/*.test.js
