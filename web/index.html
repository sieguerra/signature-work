<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>swrag · Trace</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <div class="brand-name">swrag</div>
            <div class="brand-sub">Trace explorer</div>
          </div>
        </div>
        <div class="top-controls">
          <label class="corpus-select">
            Corpus
            <select id="corpus" aria-label="Select corpus"></select>
          </label>
          <div class="top-meta" id="top-meta">Loading backend…</div>
        </div>
      </header>

      <aside class="sidebar">
        <div class="sidebar-head">
          <span>Runs</span>
          <div class="sidebar-actions">
            <button type="button" class="ghost" id="refresh-runs">Refresh</button>
            <button type="button" class="ghost danger" id="delete-all-runs">Delete all</button>
          </div>
        </div>
        <div class="eval-strip" id="eval-strip">n=0</div>
        <div class="run-list" id="run-list"></div>
      </aside>

      <main class="main">
        <section class="playground">
          <label class="sr-only" for="question">Question</label>
          <textarea
            id="question"
            rows="2"
            placeholder="Ask a question over the local corpus…"
          ></textarea>
          <div class="playground-row">
            <div class="chips" id="example-chips"></div>
            <div class="playground-controls">
              <label class="mode">
                Mode
                <select id="mode">
                  <option value="loop_confirm" selected>Loop (confirm recovery)</option>
                  <option value="loop">Loop (auto recover)</option>
                  <option value="baseline">Baseline RAG</option>
                  <option value="retrieve_only">Retrieve only</option>
                </select>
              </label>
              <button type="button" class="primary" id="run-btn">Run</button>
            </div>
          </div>
          <div class="banner hidden" id="error-banner" role="alert"></div>
        </section>

        <section class="answer-bar hidden" id="answer-bar">
          <div class="answer-kicker">
            <span>Output</span>
            <span class="run-id" id="answer-run-id"></span>
          </div>
          <div id="answer-text"></div>
        </section>

        <section class="recover-bar hidden" id="recover-bar"></section>

        <section class="workspace" id="workspace">
          <div class="waterfall-pane">
            <div class="pane-label">Trace</div>
            <ol class="waterfall" id="waterfall"></ol>
          </div>
          <div class="inspector-pane">
            <div class="pane-label" id="inspector-label">Inspector</div>
            <div class="inspector" id="inspector"></div>
          </div>
        </section>
      </main>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
